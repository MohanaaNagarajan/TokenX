name: tokenx
description: "TokenX - Smart Hostel Mess Special-Food Token Management Application for K Ramakrishnan College of Technology (KRCT)."
publish_to: "none"
version: 1.0.2+3

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  intl: ^0.19.0
  csv: ^6.0.0
  share_plus: ^10.0.2
  path_provider: ^2.1.4
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
